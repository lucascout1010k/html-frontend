<html>
  <head>
    <meta charset="UTF-8">
    <title>Formulário de cadastro</title>
    <link href="estilo.css" rel="stylesheet">
  </head>
  <body>
      <header>
        <img class="img-topo" src="http://icons.iconarchive.com/icons/xenatt/the-circle/512/App-Soundcloud-icon.png">
        <h1>Site do lucas</h1>
        <h3>Subtitulo do meu site</h3>
      </header>
      <div class="form">
    <h1>Formulário de cadastro</h1>
    <form action="obrigado.html" method="get">
      <fieldset>
        <legend> Dados pessoais</legend>

        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" required><br> 
        <label>E-mail:</label>
        <input type="email" name="email" placeholder="Digite seu e-mail"><br>
        <label>Idade</label>
        <input type="number" max="999" placeholder="Digite sua idade"><br>
        <label>Telefone:</label>
        <input type="number" max="99999999999" name="telefone" placeholder="Digite seu telefone"><br>
        </fieldset>

        <fieldset>
        <legend>Sobre seu curso</legend>
        <label>Avalie nosso site:</label>
        <input type="range" min="0" max="5" step=".1"><br>
        <label>Selecione o seu curso</label>
        <select name="curso">
            <option disabled selected>Selecione na lista</option>
            <option value="ADS">ADS</option> 
            <option value="Medicina">Medicina</option> 
            <option value="Administração">Administração</option>
            <option value="Nada">Não decidi ainda</option>

        </select><br>

        <span>Selecione o periodo:</span>
        <input type="checkbox" name="manhã">
        <label>Manhã</label>
        <input type="checkbox" name="tarde">
        <label>tarde</label>
        <input type="checkbox" name="noite">
        <label>Noite</label><br>
        
        <label>Digite uma mensagem/comentário</label>
        <textarea name="cometario" placeholder="Digite seu comentário"></textarea>
        </fieldset>

        <button class=btn-enviar> Enviar </button>
    
    </form>
     </div>
  </body>
</html>
